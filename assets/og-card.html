<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #f4f0e8;
        color: #1c1b18;
        font-family: Georgia, "Times New Roman", serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
        box-sizing: border-box;
      }
      .kicker {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #0d5c4d;
        margin: 0 0 20px;
      }
      h1 {
        font-size: 72px;
        line-height: 1.05;
        margin: 0;
        max-width: 14ch;
        font-weight: 600;
      }
      p {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 24px;
        color: #5a574e;
        margin: 0;
        max-width: 34em;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 20px;
      }
      .badge {
        background: #0d5c4d;
        color: #f4f0e8;
        padding: 10px 16px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div>
      <p class="kicker">Independent PDF guide</p>
      <h1>The Grok Bot Starter Guide</h1>
    </div>
    <p>A practical start for new Grok Bot users. Not an official xAI or SpaceX document.</p>
    <div class="foot">
      <span>Trevor Aquino</span>
      <span class="badge">$24 one time</span>
    </div>
  </body>
</html>
