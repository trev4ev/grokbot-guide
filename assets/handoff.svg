<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="handoffTitle handoffDesc">
  <title id="handoffTitle">A three-bot handoff</title>
  <desc id="handoffDesc">Research bot passes a brief to Draft bot, which passes a draft to Review bot. Each arrow is a written handoff, not a shared memory.</desc>
  <style>
    .box { fill: #F4F3EF; stroke: #1E1F24; stroke-width: 1; }
    .key { fill: #F4F3EF; stroke: #C2412D; stroke-width: 1.5; }
    .tag { font: 500 11px "Instrument Sans", "Helvetica Neue", Arial, sans-serif; letter-spacing: 0.1em; fill: #5B5E66; }
    .fig { font: 500 22px "Newsreader", Georgia, serif; fill: #1E1F24; }
    .figk { font: 500 22px "Newsreader", Georgia, serif; fill: #C2412D; }
    .label { font: 500 21px "Newsreader", Georgia, serif; fill: #1E1F24; }
    .sub { font: 400 13px "Instrument Sans", "Helvetica Neue", Arial, sans-serif; fill: #5B5E66; }
    .arrow { stroke: #2F4B7C; stroke-width: 1.25; fill: none; marker-end: url(#arrow); }
    .note { font: 400 11px "JetBrains Mono", Menlo, monospace; fill: #2F4B7C; }
    .rule { stroke: #C9C8C2; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#2F4B7C" stroke-width="1.25"/>
    </marker>
  </defs>

  <rect x="24.5" y="48.5" width="200" height="150" class="box"/>
  <line x1="24.5" y1="88.5" x2="224.5" y2="88.5" class="rule"/>
  <text x="40" y="74" class="fig">1</text>
  <text x="208" y="73" text-anchor="end" class="tag">BOT A</text>
  <text x="40" y="120" class="label">Research</text>
  <text x="40" y="146" class="sub">Scope: sources only.</text>
  <text x="40" y="166" class="sub">Output: a brief, not a draft.</text>

  <path d="M236 123.5 H 308" class="arrow"/>
  <text x="270" y="112" text-anchor="middle" class="note">handoff</text>

  <rect x="320.5" y="48.5" width="200" height="150" class="box"/>
  <line x1="320.5" y1="88.5" x2="520.5" y2="88.5" class="rule"/>
  <text x="336" y="74" class="fig">2</text>
  <text x="504" y="73" text-anchor="end" class="tag">BOT B</text>
  <text x="336" y="120" class="label">Draft</text>
  <text x="336" y="146" class="sub">Scope: write from the brief.</text>
  <text x="336" y="166" class="sub">Output: a first pass.</text>

  <path d="M532 123.5 H 604" class="arrow"/>
  <text x="566" y="112" text-anchor="middle" class="note">handoff</text>

  <rect x="616.5" y="48.5" width="200" height="150" class="key"/>
  <line x1="616.5" y1="88.5" x2="816.5" y2="88.5" class="rule"/>
  <text x="632" y="74" class="figk">3</text>
  <text x="800" y="73" text-anchor="end" class="tag">BOT C</text>
  <text x="632" y="120" class="label">Review</text>
  <text x="632" y="146" class="sub">Scope: check and tighten.</text>
  <text x="632" y="166" class="sub">Output: a shippable version.</text>

  <line x1="24.5" y1="222.5" x2="816.5" y2="222.5" class="rule"/>
  <text x="420" y="248" text-anchor="middle" class="sub">Each bot keeps a narrow job. The written handoff is the only thing that moves.</text>
</svg>
